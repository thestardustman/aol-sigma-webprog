[phases.build]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.gd", "php83Extensions.zip", "nodejs_20", "npm-9_x"]
cmds = [
    "npm install",
    "npm run build",
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.gd", "php83Extensions.zip"]

[start]
cmd = "echo 'Starting deployment...' && php artisan migrate --force --verbose && echo 'Migrations complete' && php artisan db:seed --force && echo 'Seeding complete' && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
